name: Release desktop builds

on:
  workflow_dispatch:
  push:
    branches:
      - "release/**"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: universal-apple-darwin
            args: "--target universal-apple-darwin --bundles dmg"
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: "--target x86_64-pc-windows-msvc --bundles nsis"
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: "--target x86_64-unknown-linux-gnu --bundles appimage"
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 xdg-utils

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.platform != 'macos-latest'

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.platform == 'macos-latest'
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --config.strictDepBuilds=false

      - name: Rebuild approved native dependencies
        run: pnpm rebuild lefthook unrs-resolver

      - name: Build shared contracts
        run: pnpm build:contracts

      - name: Build Go engine sidecar
        run: node scripts/build-release-sidecar.mjs ${{ matrix.target }}

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "KubeView v__VERSION__"
          releaseBody: |
            KubeView __VERSION__ desktop builds.

            macOS: universal DMG for Apple Silicon and Intel.
            Windows: x64 NSIS installer.
            Linux: x64 AppImage.

            These are unsigned beta builds. On macOS, right-click the app and choose Open. On Windows, use More info > Run anyway if SmartScreen appears. On Linux, mark the AppImage executable before launching.

            KubeView reads your local kubeconfig and installs nothing in the cluster.
          releaseDraft: true
          prerelease: true
          tauriScript: pnpm exec tauri
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          args: ${{ matrix.args }}
