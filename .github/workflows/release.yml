name: Release desktop builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v0.2.0)
        required: true
        default: v0.2.0

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - run: pnpm install --frozen-lockfile --config.strictDepBuilds=false
      - run: pnpm rebuild lefthook unrs-resolver
      - run: pnpm build:contracts
      - run: pnpm --filter @kubeview/desktop typecheck
      - run: go -C engine test ./...
      - name: Verify tag matches app version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "v${VERSION}" = "${RELEASE_TAG}" || {
            echo "Tag ${RELEASE_TAG} does not match package version v${VERSION}"
            exit 1
          }

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: universal-apple-darwin
            args: "--target universal-apple-darwin --bundles dmg"
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: "--target x86_64-pc-windows-msvc --bundles nsis"
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: "--target x86_64-unknown-linux-gnu --bundles appimage deb"
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 xdg-utils

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.platform != 'macos-latest'
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.platform == 'macos-latest'
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile --config.strictDepBuilds=false
      - run: pnpm rebuild lefthook unrs-resolver
      - run: pnpm build:contracts
      - run: node scripts/build-release-sidecar.mjs ${{ matrix.target }}
      - run: pnpm exec tauri build ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          retention-days: 7
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          find . -type f ! -name SHA256SUMS.txt -exec sha256sum {} + \
            | sed 's#  \./#  #' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub release
        run: |
          VERSION="${RELEASE_TAG#v}"
          cat > release-notes.md <<NOTES
          KubeView ${VERSION} desktop builds.

          macOS: universal DMG for Apple Silicon and Intel.
          Windows: x64 NSIS installer.
          Linux: x64 AppImage and Debian package.

          These are unsigned beta builds. On macOS, right-click the app and choose Open. On Windows, use More info > Run anyway if SmartScreen appears. On Linux, mark the AppImage executable before launching.

          KubeView reads your local kubeconfig and installs nothing in the cluster.
          NOTES
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" --title "KubeView ${RELEASE_TAG}" --notes-file release-notes.md --draft=false --prerelease=false
          else
            gh release create "${RELEASE_TAG}" --verify-tag --title "KubeView ${RELEASE_TAG}" --notes-file release-notes.md
          fi
          find dist -type f ! -name SHA256SUMS.txt -print0 \
            | xargs -0 gh release upload "${RELEASE_TAG}" --clobber
          gh release upload "${RELEASE_TAG}" dist/SHA256SUMS.txt --clobber

  distribute:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      DISTRIBUTION_TOKEN: ${{ secrets.DISTRIBUTION_TOKEN }}
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN || secrets.DISTRIBUTION_TOKEN }}
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: dist
          merge-multiple: true

      - name: Distribution credential check
        if: env.DISTRIBUTION_TOKEN == ''
        run: |
          echo "::warning::DISTRIBUTION_TOKEN is not configured. Landing, Homebrew, Scoop, and winget updates were skipped."

      - name: Sync landing site and installers
        if: env.DISTRIBUTION_TOKEN != ''
        run: |
          VERSION="${RELEASE_TAG#v}"
          git clone --depth 1 "https://x-access-token:${DISTRIBUTION_TOKEN}@github.com/PorKeat/KubeView-landing.git" landing
          mkdir -p landing/public/downloads
          find dist -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) -exec cp {} landing/public/downloads/ \;
          sed -i -E "s/version: \"[0-9.]+\"/version: \"${VERSION}\"/" landing/src/lib/site.ts
          cd landing
          git config user.name "KubeView Release"
          git config user.email "release@kubeview.local"
          git add public/downloads src/lib/site.ts
          git diff --cached --quiet || git commit -m "release: KubeView ${VERSION}"
          git push origin HEAD
          if [ -n "${VERCEL_DEPLOY_HOOK}" ]; then
            curl -fsS -X POST "${VERCEL_DEPLOY_HOOK}" >/dev/null || true
          fi

      - name: Update Homebrew cask
        if: env.DISTRIBUTION_TOKEN != ''
        run: |
          VERSION="${RELEASE_TAG#v}"
          DMG="$(find dist -name '*.dmg' | head -1)"
          SHA="$(sha256sum "${DMG}" | awk '{print $1}')"
          git clone --depth 1 "https://x-access-token:${DISTRIBUTION_TOKEN}@github.com/PorKeat/homebrew-kubeview.git" homebrew
          cd homebrew
          sed -i -E "s/version \"[0-9.]+\"/version \"${VERSION}\"/" Casks/kubeview.rb
          sed -i -E "s/sha256 \"[a-f0-9]+\"/sha256 \"${SHA}\"/" Casks/kubeview.rb
          git config user.name "KubeView Release"
          git config user.email "release@kubeview.local"
          git add Casks/kubeview.rb
          git diff --cached --quiet || git commit -m "release: KubeView ${VERSION}"
          git push origin HEAD

      - name: Update Scoop manifest
        if: env.DISTRIBUTION_TOKEN != ''
        run: |
          VERSION="${RELEASE_TAG#v}"
          EXE="$(find dist -name '*.exe' | head -1)"
          SHA="$(sha256sum "${EXE}" | awk '{print $1}')"
          URL="https://kubeview.sengporkeat.com/downloads/KubeView_${VERSION}_x64-setup.exe"
          git clone --depth 1 "https://x-access-token:${DISTRIBUTION_TOKEN}@github.com/PorKeat/scoop-kubeview.git" scoop
          cd scoop
          jq --arg version "${VERSION}" --arg url "${URL}" --arg hash "${SHA}" \
            '.version = $version | .url = $url | .hash = $hash' \
            bucket/kubeview.json > bucket/kubeview.json.tmp
          mv bucket/kubeview.json.tmp bucket/kubeview.json
          git config user.name "KubeView Release"
          git config user.email "release@kubeview.local"
          git add bucket/kubeview.json
          git diff --cached --quiet || git commit -m "release: KubeView ${VERSION}"
          git push origin HEAD

      - name: Open winget update PR
        if: env.WINGET_TOKEN != ''
        continue-on-error: true
        run: |
          set -e
          VERSION="${RELEASE_TAG#v}"
          EXE="$(find dist -name '*.exe' | head -1)"
          EXE_NAME="$(basename "${EXE}")"
          URL="https://github.com/PorKeat/KubeView/releases/download/${RELEASE_TAG}/${EXE_NAME}"
          dotnet tool install --global Microsoft.WinGet.Create
          export PATH="$PATH:${HOME}/.dotnet/tools"
          wingetcreate update KubeView.KubeView --version "${VERSION}" --urls "${URL}" --submit --token "${WINGET_TOKEN}"
