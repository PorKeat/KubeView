name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:contracts
      - run: pnpm format:check
      - run: pnpm --filter @kubeview/desktop typecheck
      - run: pnpm --filter @kubeview/desktop lint
      - run: pnpm --filter @kubeview/desktop build
      - run: go -C engine test ./...
      - run: go -C engine vet ./...
      - run: test -z "$(gofmt -l engine)"

  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev build-essential patchelf
      - run: mkdir -p apps/desktop/out
      - run: cargo check --manifest-path src-tauri/Cargo.toml
